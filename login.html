{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5 col-lg-4">
        <div class="card border-0 shadow-lg p-3">
            <div class="card-body">
                <h3 class="fw-bold text-dark text-center mb-1" style="letter-spacing: -0.5px;">Área Restrita</h3>
                <p class="text-muted small text-center mb-4">Painel exclusivo para professores e administração</p>
                
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary">Utilizador</label>
                        <input type="text" name="username" class="form-control" placeholder="Nome de utilizador" required autocomplete="off">
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-medium text-secondary">Palavra-passe</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2.5 shadow-sm fw-medium">Entrar no Painel</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
